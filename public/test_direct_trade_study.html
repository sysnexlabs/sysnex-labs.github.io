<!DOCTYPE html>
<html>
<head>
    <title>Direct Trade Study Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Direct WASM Trade Study Test</h1>
    <div id="output">Loading...</div>

    <script type="module">
        const output = document.getElementById('output');
        const testCode = `package 'Vehicle Powertrain Trade Study' {
    /* Trade study comparing electric vs hybrid powertrains */

    part def Powertrain {
        attribute cost : Real;
        attribute range : Real;
        attribute power : Real;
        attribute emissions : Real;
    }

    part def ElectricPowertrain :> Powertrain {
        :>> cost = 35000.0;
        :>> range = 400.0;
        :>> power = 150.0;
        :>> emissions = 0.0;
    }

    part def HybridPowertrain :> Powertrain {
        :>> cost = 28000.0;
        :>> range = 600.0;
        :>> power = 130.0;
        :>> emissions = 95.0;
    }
}`;

        async function test() {
            try {
                output.innerHTML = '<p class="info">Loading WASM module...</p>';

                // Import WASM module
                const wasm = await import('/wasm/sysml_wasm_bridge.js');
                // Explicitly pass the WASM binary path to ensure it loads correctly
                await wasm.default({ module_or_path: '/wasm/sysml_wasm_bridge_bg.wasm' });

                output.innerHTML += '<p class="success">✅ WASM module loaded</p>';

                // Create instance
                const bridge = new wasm.SysMLWasm();
                output.innerHTML += '<p class="success">✅ SysMLWasm instance created</p>';

                // Check if function exists
                if (typeof bridge.generate_trade_study !== 'function') {
                    output.innerHTML += '<p class="error">❌ generate_trade_study NOT FOUND</p>';
                    output.innerHTML += '<p>Available methods:</p><pre>' +
                        Object.getOwnPropertyNames(Object.getPrototypeOf(bridge))
                            .filter(m => typeof bridge[m] === 'function')
                            .join('\n') + '</pre>';
                    return;
                }

                output.innerHTML += '<p class="success">✅ generate_trade_study function exists</p>';

                // Call the function
                output.innerHTML += '<p class="info">Calling generate_trade_study...</p>';
                let result;
                try {
                    result = bridge.generate_trade_study(testCode, 'test://file');
                    output.innerHTML += '<p class="info">Function returned: ' + (typeof result) + '</p>';

                    if (result === undefined || result === null) {
                        throw new Error('Function returned ' + result);
                    }
                } catch (innerError) {
                    output.innerHTML += '<p class="error">❌ Function call error: ' + innerError.message + '</p>';
                    if (innerError.stack) {
                        output.innerHTML += '<pre>' + innerError.stack + '</pre>';
                    }
                    throw innerError;
                }

                output.innerHTML += '<p class="success">✅ Function executed successfully!</p>';
                output.innerHTML += '<h2>Results:</h2>';
                output.innerHTML += '<pre>' + JSON.stringify(result, null, 2) + '</pre>';

                // Summary
                output.innerHTML += '<h2>Summary:</h2>';
                output.innerHTML += `<p><strong>Variants:</strong> ${result.variants?.length || 0}</p>`;
                output.innerHTML += `<p><strong>Scores:</strong> ${result.scores?.length || 0}</p>`;
                output.innerHTML += `<p><strong>Comparisons:</strong> ${result.comparisons?.length || 0}</p>`;
                output.innerHTML += `<p><strong>Attributes:</strong> ${result.attributeNames?.length || 0}</p>`;

                if (result.variants && result.variants.length > 0) {
                    output.innerHTML += '<p class="success" style="font-size: 1.2em; font-weight: bold;">🎉 SUCCESS!</p>';
                } else {
                    output.innerHTML += '<p class="error" style="font-size: 1.2em; font-weight: bold;">❌ FAILED - No variants extracted</p>';
                }

            } catch (error) {
                output.innerHTML += '<p class="error">❌ Error: ' + error.message + '</p>';
                output.innerHTML += '<pre>' + error.stack + '</pre>';
            }
        }

        test();
    </script>
</body>
</html>
