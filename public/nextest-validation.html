<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexTest Assertion Extraction - Validation</title>
    <style>
        body {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #667eea;
            margin-top: 0;
            font-size: 2em;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9em;
        }
        .status.loading {
            background: #fef3c7;
            color: #92400e;
        }
        .status.success {
            background: #d1fae5;
            color: #065f46;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }
        .code-block {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
            font-size: 0.9em;
            line-height: 1.6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }
        tr:hover {
            background: #f9fafb;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .badge.valid {
            background: #d1fae5;
            color: #065f46;
        }
        .badge.invalid {
            background: #fee2e2;
            color: #991b1b;
        }
        .expression {
            font-family: 'SF Mono', Monaco, monospace;
            background: #f3f4f6;
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid #667eea;
            display: block;
            margin: 5px 0;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .stat-value {
            font-size: 3em;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 10px;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .log {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.85em;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-entry.success { color: #065f46; }
        .log-entry.error { color: #991b1b; }
        .log-entry.info { color: #1e40af; }
        h2 {
            color: #374151;
            margin-top: 40px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .methods-list {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 0.85em;
        }
        .method-name {
            font-family: monospace;
            background: #e5e7eb;
            padding: 2px 6px;
            border-radius: 3px;
            margin: 2px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            🧪 NexTest Assertion Extraction Validation
            <span id="status" class="status loading">Loading WASM...</span>
        </h1>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="assertionCount">-</div>
                <div class="stat-label">Assertions Extracted</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="validCount">-</div>
                <div class="stat-label">Valid Assertions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="expressionCount">-</div>
                <div class="stat-label">Expressions Captured</div>
            </div>
        </div>

        <h2>📋 Test Code</h2>
        <div class="code-block" id="sourceCode"></div>

        <h2>🔧 Available WASM Methods</h2>
        <div class="methods-list" id="methodsList">Loading...</div>

        <h2>📊 Execution Log</h2>
        <div class="log" id="log"></div>

        <h2>✅ Extracted Assertions</h2>
        <table id="assertionsTable">
            <thead>
                <tr>
                    <th>Assertion Name</th>
                    <th>Constraint Expression</th>
                    <th>Is Negated</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="assertionsBody">
                <tr>
                    <td colspan="4" style="text-align: center; padding: 30px; color: #9ca3af;">
                        Waiting for WASM to load...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        const log = (message, type = 'info') => {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        };

        const setStatus = (text, type) => {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = `status ${type}`;
        };

        // Test code - same as NexTest demo
        const testCode = `package 'Battery Management Testing' {
    part def BatteryManagementSystem {
        attribute voltage : Real;
        attribute current : Real;
        attribute temperature : Real;
        attribute stateOfCharge : Real;
    }

    verification def ChargeCycleTest {
        subject testBMS : BatteryManagementSystem;

        assert constraint socReached { testBMS.stateOfCharge >= 100.0 }
        assert constraint noVoltageViolation { testBMS.voltage <= 4.2 }
        assert constraint noTempViolation { testBMS.temperature <= 60.0 }
    }
}`;

        // Display source code
        document.getElementById('sourceCode').innerHTML = testCode
            .replace(/\n/g, '<br>')
            .replace(/\s{4}/g, '&nbsp;&nbsp;&nbsp;&nbsp;')
            .replace(/\s{2}/g, '&nbsp;&nbsp;');

        async function runValidation() {
            try {
                log('Initializing WASM module...', 'info');
                setStatus('Loading WASM...', 'loading');

                // Import WASM module
                const wasmModule = await import('/wasm/sysml_wasm_bridge.js');
                log('WASM module imported successfully', 'success');

                // Initialize WASM
                await wasmModule.default();
                log('WASM runtime initialized', 'success');

                // Create SysMLWasm instance
                const wasm = new wasmModule.SysMLWasm();
                log('SysMLWasm instance created', 'success');

                // List available methods (with defensive checks)
                let methods = [];
                try {
                    if (wasm && typeof wasm === 'object') {
                        const proto = Object.getPrototypeOf(wasm);
                        if (proto) {
                            methods = Object.getOwnPropertyNames(proto)
                                .filter(m => !m.startsWith('_') && m !== 'constructor' && m !== 'free');
                        }
                        // Also check direct properties
                        const directMethods = Object.keys(wasm).filter(k => typeof wasm[k] === 'function');
                        methods = [...new Set([...methods, ...directMethods])];
                    }
                } catch (e) {
                    log(`Warning: Could not enumerate methods: ${e.message}`, 'info');
                }

                log(`Found ${methods.length} WASM methods`, 'info');

                const methodsDiv = document.getElementById('methodsList');
                if (methods.length > 0) {
                    methodsDiv.innerHTML = methods.map(m =>
                        `<span class="method-name">${m}</span>`
                    ).join(' ');
                } else {
                    methodsDiv.textContent = 'Could not enumerate methods (this is okay if extract_assertions works)';
                }

                // Check if extract_assertions is available
                if (typeof wasm.extract_assertions !== 'function') {
                    throw new Error('extract_assertions method not found in WASM module');
                }
                log('✓ extract_assertions method is available', 'success');

                // WORKAROUND: Since we can't easily get verification ID, we'll try common IDs
                // In the test, verification ID is 2
                const tryIds = [2, 1, 3, 4, 5];
                let assertions = null;
                let foundId = null;

                for (const testId of tryIds) {
                    try {
                        log(`Trying verification ID: ${testId}...`, 'info');
                        const result = wasm.extract_assertions(testCode, BigInt(testId));
                        if (result && result.length > 0) {
                            assertions = result;
                            foundId = testId;
                            log(`✓ Found ${result.length} assertions with ID ${testId}`, 'success');
                            break;
                        }
                    } catch (e) {
                        log(`  ID ${testId} failed: ${e.message}`, 'info');
                    }
                }

                if (!assertions || assertions.length === 0) {
                    throw new Error('Could not extract assertions with any verification ID');
                }

                log(`Successfully extracted assertions using verification ID: ${foundId}`, 'success');

                // Update stats
                document.getElementById('assertionCount').textContent = assertions.length;

                const validCount = assertions.filter(a => a.constraintExpression).length;
                document.getElementById('validCount').textContent = validCount;
                document.getElementById('expressionCount').textContent = validCount;

                // Display assertions in table
                const tbody = document.getElementById('assertionsBody');
                tbody.innerHTML = '';

                assertions.forEach((assertion, index) => {
                    const row = document.createElement('tr');

                    const isValid = assertion.constraintExpression && assertion.constraintExpression.trim().length > 0;

                    row.innerHTML = `
                        <td><strong>${assertion.name || 'unnamed assertion'}</strong></td>
                        <td>${assertion.constraintExpression
                            ? `<span class="expression">${assertion.constraintExpression}</span>`
                            : '<span style="color: #9ca3af;">No expression found</span>'
                        }</td>
                        <td>${assertion.isNegated ? '✓ Yes' : '✗ No'}</td>
                        <td><span class="badge ${isValid ? 'valid' : 'invalid'}">${isValid ? '✓ Valid' : '✗ Invalid'}</span></td>
                    `;
                    tbody.appendChild(row);

                    log(`Assertion ${index + 1}: "${assertion.name}" - ${isValid ? 'VALID ✓' : 'INVALID ✗'}`, isValid ? 'success' : 'error');
                    if (isValid) {
                        log(`  Expression: ${assertion.constraintExpression}`, 'success');
                    }
                });

                if (validCount === assertions.length && validCount === 3) {
                    setStatus('✅ All Tests Passed', 'success');
                    log('🎉 SUCCESS: All 3 assertions extracted with correct names and expressions!', 'success');
                } else if (validCount > 0) {
                    setStatus('⚠️ Partial Success', 'error');
                    log(`WARNING: Only ${validCount}/3 assertions have expressions`, 'error');
                } else {
                    setStatus('❌ Failed', 'error');
                    log('ERROR: No assertions have constraint expressions', 'error');
                }

            } catch (error) {
                setStatus('❌ Error', 'error');
                log(`ERROR: ${error.message}`, 'error');
                console.error('Validation error:', error);

                const tbody = document.getElementById('assertionsBody');
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 30px; color: #ef4444;">
                    <strong>Error:</strong> ${error.message}<br>
                    <small>Check console for details</small>
                </td></tr>`;
            }
        }

        // Run validation on load
        runValidation();
    </script>
</body>
</html>
